<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="icon" href="../images/logo.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <title>Login</title>
</head>
<body>
    <main class="container">
        <h1>Login</h1>
        <form class="form">
            <label for="username__input">Username</label>
            <input type="text" placeholder="Username" id="username__input" class="form__item">
            <label for="password__input">Password</label>
            <input type="password" placeholder="Password" id="password__input" class="form__item">
            <a href="register.html">Don't have an account? Register</a>
            <button type="submit" class="form__button">Submit</button>
        </form>
    </main>
</body>
</html>
